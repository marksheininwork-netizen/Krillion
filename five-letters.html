<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five Letters · Tideplay</title><style>*{box-sizing:border-box}body{margin:0;background:#091b29;color:#f2ffff;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 16px;text-align:center}a{color:#a2f3e6}h1{font-size:36px;margin:20px 0 5px}p{color:#a8c7d0}.board{display:grid;gap:6px;margin:30px auto;width:max-content}.row{display:flex;gap:6px}.tile{width:min(14vw,59px);height:min(14vw,59px);border:2px solid #3d5c69;display:grid;place-items:center;font-size:28px;font-weight:900;text-transform:uppercase;border-radius:5px}.tile.hit{background:#45876a;border-color:#45876a}.tile.near{background:#b69c48;border-color:#b69c48}.tile.miss{background:#405260;border-color:#405260}.keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:30px}.keys button{border:0;border-radius:5px;background:#315062;color:white;padding:11px 8px;min-width:30px;font-weight:800}.keys button.hit{background:#45876a}.keys button.near{background:#b69c48}.keys button.miss{background:#405260}.actions{margin:20px;display:flex;justify-content:center;gap:12px}button{cursor:pointer}.actions button{background:#a2f3e6;color:#08263a;border:0;padding:12px 16px;border-radius:10px;font-weight:800}.status{min-height:25px;color:#c8f2d9}</style></head><body><main><a href="/portal.html">← Tideplay</a><h1>Five Letters</h1><p>Find the hidden five-letter word in six guesses.</p><div id="board" class="board"></div><div class="status" id="status" aria-live="polite"></div><div class="keys" id="keys"></div><div class="actions"><button id="restart">New puzzle</button><button id="share">Share</button></div><p>Green = correct position · Gold = elsewhere · Gray = absent</p></main><script>
const words=['ocean','coral','tides','waves','shore','pearl','whale','beach','shell','water','storm','cloud','flame','plant','stone','light','night','smile','music','dance','brain','dream','fruit','grape','apple','lemon','mango','heart','world','earth','river','grass','green','brown','black','white','chair','table','house','mouse','horse','tiger','zebra','eagle','snake','piano','train','plane','clock','watch','sugar','honey','bread','spice','pizza','pasta','sauce','onion','salad','candy','sweet','speak','write','learn','think','smart','happy','laugh','quiet','sound','noise','voice','movie','story','books','paper','paint','brush','color','shape','round','square','point','score','games','party','group','alone','together','enter','start','begin','final','guess','solve','logic','clues','trick','magic','fairy','royal','queen','kings','crown','jewel','coins','money','trade','shops','store','price','value','equal','whole','parts','piece','sight','scent','touch','taste','smell','north','south','east','west','space','stars','solar','orbit','comet','alien','robot','human','adult','child','youth','older','young','giant','small','large','short','tall','great','grand','noble','brave','proud','honor','peace','trust','truth','false','error','right','wrong','clear','clean','fresh','sharp','quick','rapid','speed','swift','slows','early','later','today','daily','weeks','month','years','hours','times','first','third','fifth','seven','eight','three','forty','sixty','level','depth','diver','dives','swims','float','sinks','flood','creek','ponds','lakes','oasis','isles','coast','delta','marsh','reefs','kelps','shark','squid','crabs','snail','otter','seals','birds','fishy'];const $=id=>document.getElementById(id);let answer='',guesses=[],current='',over=false,keyboard={};function newGame(){answer=words[Math.floor(Math.random()*words.length)].toUpperCase();guesses=[];current='';over=false;keyboard={};$('status').textContent='';draw()}function score(guess){const out=Array(5).fill('miss'),remaining={};for(let i=0;i<5;i++){if(guess[i]===answer[i])out[i]='hit';else remaining[answer[i]]=(remaining[answer[i]]||0)+1}for(let i=0;i<5;i++){if(out[i]!=='hit'&&remaining[guess[i]]>0){out[i]='near';remaining[guess[i]]--}}return out}function draw(){const b=$('board');b.innerHTML='';for(let r=0;r<6;r++){const row=document.createElement('div');row.className='row';const guess=guesses[r]|| (r===guesses.length?current:'');const scores=r<guesses.length?score(guesses[r]):[];for(let c=0;c<5;c++){const t=document.createElement('div');t.className='tile '+(scores[c]||'');t.textContent=guess[c]||'';row.append(t)}b.append(row)}const k=$('keys');k.innerHTML='';for(const char of 'QWERTYUIOPASDFGHJKLZXCVBNM'){const btn=document.createElement('button');btn.textContent=char;btn.className=keyboard[char]||'';btn.onclick=()=>press(char);k.append(btn)}for(const char of ['ENTER','⌫']){const btn=document.createElement('button');btn.textContent=char;btn.onclick=()=>press(char==='⌫'?'BACKSPACE':char);k.append(btn)}}function press(key){if(over)return;if(key==='BACKSPACE')current=current.slice(0,-1);else if(key==='ENTER'){if(current.length!==5){$('status').textContent='Enter five letters.';return}const guess=current;guesses.push(guess);const s=score(guess);const priority={miss:1,near:2,hit:3};for(let i=0;i<5;i++)if((priority[s[i]]||0)>(priority[keyboard[guess[i]]]||0))keyboard[guess[i]]=s[i];current='';if(guess===answer){over=true;$('status').textContent='Solved in '+guesses.length+' guesses!'}else if(guesses.length===6){over=true;$('status').textContent='The answer was '+answer+'.'}else $('status').textContent=''}else if(/^[A-Z]$/.test(key)&&current.length<5)current+=key;draw()}document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;press(e.key==='Backspace'?'BACKSPACE':e.key.toUpperCase())});$('restart').onclick=newGame;$('share').onclick=()=>{const out='Five Letters '+guesses.length+'/6\n'+guesses.map(g=>score(g).map(x=>x==='hit'?'🟩':x==='near'?'🟨':'⬛').join('')).join('\n');if(navigator.share)navigator.share({text:out}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(out).then(()=>$('status').textContent='Copied!')};newGame();
</script></body></html>
