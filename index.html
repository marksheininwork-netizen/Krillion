<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e1e"><title>Krillion — Endless Arena</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eff5ff;background:#080e1e}*{box-sizing:border-box}body{margin:0;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;background:radial-gradient(circle at 50% 40%,#15264a,#080e1e 75%)}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}.pill{background:#0a1635cf;border:1px solid #4265a777;border-radius:16px;padding:10px 15px;backdrop-filter:blur(10px);font-weight:750;box-shadow:0 8px 30px #0004}.pill span{color:#82f4dd}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#060c1ab9;backdrop-filter:blur(8px);padding:20px}.panel{width:min(470px,100%);text-align:center;background:linear-gradient(150deg,#182c55,#0d1630);border:1px solid #6082c877;border-radius:26px;padding:35px 26px;box-shadow:0 30px 100px #000a}h1{font-size:clamp(38px,9vw,64px);letter-spacing:-.07em;margin:0 0 10px;background:linear-gradient(90deg,#8cecff,#a88aff);color:transparent;background-clip:text}.sub{color:#b8c9eb;line-height:1.65}button{background:linear-gradient(120deg,#43e3d0,#7995ff);color:#061128;font-weight:900;border:0;border-radius:15px;padding:15px 30px;font-size:17px;cursor:pointer;margin-top:12px;box-shadow:0 8px 35px #32cdbd44}button:hover{filter:brightness(1.12)}.help{font-size:13px;color:#91a6d0;margin-top:20px}.hidden{display:none}.touch{position:fixed;bottom:26px;left:24px;width:124px;height:124px;border:2px solid #93baff55;background:#15315d66;border-radius:50%;display:none;touch-action:none}.nub{position:absolute;left:42px;top:42px;width:40px;height:40px;border-radius:50%;background:#86e8ff99;box-shadow:0 0 18px #86e8ff66}.dash{position:fixed;right:24px;bottom:48px;width:84px;height:84px;border-radius:50%;display:none;padding:0;margin:0;font-size:15px}@media(pointer:coarse){.touch,.dash{display:block}.help{font-size:12px}}
</style></head><body><canvas id="game" aria-label="Krillion arena"></canvas><div class="hud"><div class="pill">✦ <span id="score">0</span> points</div><div class="pill">Wave <span id="wave">1</span> · ♥ <span id="health">100</span></div><div class="pill">Best <span id="best">0</span></div></div><div class="touch" id="stick"><div class="nub" id="nub"></div></div><button class="dash" id="dash">DASH</button><div class="overlay" id="overlay"><div class="panel"><h1>KRILLION</h1><div class="sub" id="message">Survive the endless neon arena. Collect energy, evade the swarm, and unleash automatic pulse shots.</div><button id="start">START GAME →</button><div class="help">WASD / Arrow keys to move · Space to dash<br>Mobile: drag joystick · tap DASH · shots fire automatically</div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let w=0,h=0,dpr=1,run=false,last=0,elapsed=0,score=0,wave=1,spawn=0,shot=0,particles=[],enemies=[],bullets=[],orbs=[],keys=new Set(),joy={x:0,y:0},best=0;try{best=Number(localStorage.getItem('krillion-best'))||0}catch{}$('best').textContent=best;const p={x:0,y:0,r:15,hp:100,inv:0,dash:0,dx:1,dy:0};function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);p.x=Math.min(Math.max(p.x,20),w-20);p.y=Math.min(Math.max(p.y,20),h-20)}addEventListener('resize',resize);resize();function reset(){elapsed=score=spawn=shot=0;wave=1;enemies=[];bullets=[];particles=[];orbs=[];p.x=w/2;p.y=h/2;p.hp=100;p.inv=p.dash=0;run=true;$('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(frame)}$('start').onclick=reset;function dash(){if(!run||p.dash>0)return;p.dash=3;p.inv=.3;const len=Math.hypot(p.dx,p.dy)||1;p.x=Math.max(20,Math.min(w-20,p.x+p.dx/len*110));p.y=Math.max(20,Math.min(h-20,p.y+p.dy/len*110));burst(p.x,p.y,'#82edff',20)}$('dash').onclick=dash;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k===' ')dash();if(k==='enter'&&!run)reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));const stick=$('stick'),nub=$('nub');function stickMove(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y)||1,s=Math.min(42,m);joy.x=x/m*s/42;joy.y=y/m*s/42;nub.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))stickMove(e)});function release(){joy.x=joy.y=0;nub.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=30+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.35+Math.random()*.5,c})}}function enemy(){const side=Math.floor(Math.random()*4),x=side===0? -30:side===1?w+30:Math.random()*w,y=side===2?-30:side===3?h+30:Math.random()*h;enemies.push({x,y,r:11+Math.random()*10,s:55+Math.random()*22+wave*4,hp:1+Math.floor(wave/5),phase:Math.random()*6})}function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function end(){run=false;if(score>best){best=score;try{localStorage.setItem('krillion-best',best)}catch{}}$('best').textContent=best;$('message').textContent='You survived '+Math.floor(elapsed)+' seconds and earned '+score+' points. Your best score is '+best+'.';$('start').textContent='PLAY AGAIN →';$('overlay').classList.remove('hidden')}function frame(t){if(!run)return;const dt=Math.min((t-last)/1000,.04);last=t;elapsed+=dt;wave=1+Math.floor(elapsed/20);p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);let mx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'))+joy.x,my=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'))+joy.y;const mag=Math.hypot(mx,my);if(mag>.08){mx/=mag;my/=mag;p.dx=mx;p.dy=my;p.x=Math.max(p.r,Math.min(w-p.r,p.x+mx*230*dt));p.y=Math.max(p.r,Math.min(h-p.r,p.y+my*230*dt))}spawn-=dt;if(spawn<=0){enemy();spawn=Math.max(.17,.95-wave*.055)}shot-=dt;if(shot<=0&&enemies.length){let target=null,dist=Infinity;for(const e of enemies){const d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<dist){dist=d;target=e}}if(target){const a=Math.atan2(target.y-p.y,target.x-p.x);bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*550,vy:Math.sin(a)*550,t:1.3});shot=Math.max(.14,.36-wave*.008)}}ctx.clearRect(0,0,w,h);ctx.strokeStyle='#33518533';ctx.lineWidth=1;const grid=52,offset=(elapsed*9)%grid;for(let x=offset;x<w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=offset;y<h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt;ctx.shadowBlur=17;ctx.shadowColor='#ff5e91';circle(e.x,e.y,e.r,'#ff648e');circle(e.x,e.y,e.r*.5,'#ffd3e2');ctx.shadowBlur=0;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r&&p.inv<=0){p.hp-=18;p.inv=.7;burst(p.x,p.y,'#ff648e',15);if(p.hp<=0){p.hp=0;end();break}}}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;circle(b.x,b.y,5,'#b1fffa');let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp--;hit=true;burst(b.x,b.y,'#76e6ff',4);if(e.hp<=0){score+=10;burst(e.x,e.y,'#ff91b1',12);if(Math.random()<.35)orbs.push({x:e.x,y:e.y,r:7});enemies.splice(j,1)}break}}if(hit||b.t<=0||b.x<0||b.x>w||b.y<0||b.y>h)bullets.splice(i,1)}for(let i=orbs.length-1;i>=0;i--){const o=orbs[i];circle(o.x,o.y,o.r,'#fce579');if(Math.hypot(o.x-p.x,o.y-p.y)<p.r+o.r+5){score+=25;p.hp=Math.min(100,p.hp+3);orbs.splice(i,1);burst(p.x,p.y,'#fce579',8)}}for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;ctx.globalAlpha=Math.max(0,Math.min(1,q.t*2));circle(q.x,q.y,2.8,q.c);ctx.globalAlpha=1;if(q.t<=0)particles.splice(i,1)}ctx.shadowColor='#6dfce8';ctx.shadowBlur=25;circle(p.x,p.y,p.r+4,p.inv>0?'#ffffff55':'#46b6d744');circle(p.x,p.y,p.r,p.inv>0?'#ffffff':'#7af5e5');ctx.shadowBlur=0;circle(p.x+p.dx*6,p.y+p.dy*6,4,'#14345d');$('score').textContent=score;$('wave').textContent=wave;$('health').textContent=p.hp;requestAnimationFrame(frame)} })();
</script></body></html>
